[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "megadesk"
version = "0.1.0"
description = "MegaDesk canvas host, node exec-spec contract, and discovery"
readme = "docs/plugins.md"
requires-python = ">=3.10"
dependencies = [
    "dearpygui>=2.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
canvas = [
    "dearpygui>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["megadesk*", "engine*", "nodes*", "executive*", "new_nodes*"]
