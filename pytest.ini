[pytest]
testpaths = tests
addopts = -ra --strict-markers
# Canvas tests boot a real Dear PyGui context. Only one context can exist per
# process, so this suite must run serially — never with pytest-xdist.
markers =
    canvas: boots a real DPG canvas; needs a desktop session, runs serially
    redis: needs a reachable local Redis server
    git: builds a real local git Floor
