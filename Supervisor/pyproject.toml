[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "commander"
version = "0.1.0"
description = "GBD Windows commander / supervisor backend"
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0.0",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["commander*"]
