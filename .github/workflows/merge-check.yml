name: Merge check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: ${{ github.event.pull_request.number && format('merge-check-pr-{0}', github.event.pull_request.number) || 'merge-check-dev' }}
  cancel-in-progress: true

jobs:
  mergeable:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check pull requests are mergeable
        id: check
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            gh label create "${name}" \
              --description "${description}" \
              --color "${color}" \
              --force
          }

          file_issue() {
            local pr="$1"
            local base="$2"
            local label="$3"
            local title="$4"
            local detail="$5"
            local marker="<!-- megadesk:${label}:pr-${pr} -->"
            local pr_url
            pr_url="$(gh pr view "${pr}" --json url --jq .url)"

            local existing
            existing="$(gh issue list \
              --label "${label}" \
              --state open \
              --json number,body \
              --jq ".[] | select(.body | contains(\"megadesk:${label}:pr-${pr}\")) | .number" \
              | head -n 1)"
            if [ -n "${existing}" ]; then
              echo "Issue #${existing} already tracks PR #${pr} (${label})"
              return 0
            fi

            gh issue create \
              --title "${title}" \
              --label "${label}" \
              --body "${marker}

          ${pr_url} ${detail} \`${base}\`.

          Workflow run: ${RUN_URL}
          "
          }

          if [ "${EVENT}" = "pull_request" ]; then
            BASE="${BASE_REF}"
            PRS="${PR_NUMBER}"
          else
            BASE="dev"
            PRS="$(gh pr list --base dev --state open --json number --jq '.[].number')"
          fi

          if [ -z "${PRS}" ]; then
            echo "No pull requests to check"
            exit 0
          fi

          git fetch --no-tags origin "${BASE}"
          ensure_label failed-merge B60205 "PR does not merge into its base"
          ensure_label merge_success 0E8A16 "PR merges cleanly into its base"

          failed=0
          for pr in ${PRS}; do
            git fetch --no-tags origin "refs/pull/${pr}/head:refs/heads/pr-${pr}"
            if git merge-tree --write-tree "origin/${BASE}" "pr-${pr}" >/tmp/merge-tree.out; then
              echo "PR #${pr} merges into ${BASE}"
              file_issue "${pr}" "${BASE}" merge_success \
                "merge_success: PR #${pr} can merge into ${BASE}" \
                "merges into"
            else
              echo "PR #${pr} does not merge into ${BASE}"
              cat /tmp/merge-tree.out || true
              file_issue "${pr}" "${BASE}" failed-merge \
                "failed-merge: PR #${pr} cannot merge into ${BASE}" \
                "does not merge into"
              failed=1
            fi
          done
          exit "${failed}"

      - name: Open failed-merge issue
        if: failure() && steps.check.outcome != 'failure'
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref || 'dev' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh label create failed-merge \
            --description "PR does not merge into its base" \
            --color B60205 \
            --force

          if [ -n "${PR}" ]; then
            MARKER="<!-- megadesk:failed-merge:pr-${PR} -->"
            TITLE="failed-merge: PR #${PR} cannot merge into ${BASE}"
            BODY="${MARKER}

          ${PR_URL} does not merge into \`${BASE}\`.

          Workflow run: ${RUN_URL}
          "
          else
            MARKER="<!-- megadesk:failed-merge:run-${{ github.run_id }} -->"
            TITLE="failed-merge: merge check failed on ${BASE}"
            BODY="${MARKER}

          Merge check failed on \`${BASE}\` before it could test pull requests.

          Workflow run: ${RUN_URL}
          "
          fi

          EXISTING="$(gh issue list \
            --label failed-merge \
            --state open \
            --json number,body \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .number" \
            | head -n 1)"
          if [ -n "${EXISTING}" ]; then
            echo "Issue #${EXISTING} already tracks this failure"
            exit 0
          fi

          gh issue create --title "${TITLE}" --label failed-merge --body "${BODY}"
