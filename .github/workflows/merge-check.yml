name: Merge check

on:
  # Conflicting PRs have no merge ref, so GitHub skips `pull_request`.
  # This event runs the workflow from the PR base (`dev`), not the head.
  # Do not execute PR code: checkout the base, fetch the PR head as a ref,
  # and detect conflicts with merge-tree.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ${{ github.event.pull_request.number && format('merge-check-pr-{0}', github.event.pull_request.number) || 'merge-check-dev' }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Default ref is the PR base (pull_request_target) or the push SHA.
          # Do not set ref to github.event.pull_request.head.sha.

      - name: Check pull requests are mergeable
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Must match megadesk_contracts.human_gate.MERGE_CHECK_CONTEXT.
          # Posted onto each PR head so a push to dev updates the PR's own
          # check. This job is named `report` so its always-green Actions
          # check cannot masquerade as that signal.
          CONTEXT="mergeable"

          post_check() {
            local sha="$1"
            local conclusion="$2"
            local title="$3"
            jq -n \
              --arg name "${CONTEXT}" \
              --arg sha "${sha}" \
              --arg conclusion "${conclusion}" \
              --arg url "${RUN_URL}" \
              --arg title "${title}" \
              --arg summary "${title}" \
              '{
                name: $name,
                head_sha: $sha,
                status: "completed",
                conclusion: $conclusion,
                details_url: $url,
                output: {title: $title, summary: $summary}
              }' | gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input -
          }

          if [ "${EVENT}" = "pull_request" ] || [ "${EVENT}" = "pull_request_target" ]; then
            BASE="${BASE_REF}"
            PRS="${PR_NUMBER}"
          else
            BASE="dev"
            PRS="$(gh pr list --base dev --state open --json number --jq '.[].number')"
          fi

          if [ -z "${PRS}" ]; then
            echo "No pull requests to check"
            exit 0
          fi

          git fetch --no-tags origin "${BASE}"

          for pr in ${PRS}; do
            git fetch --no-tags origin "refs/pull/${pr}/head:refs/heads/pr-${pr}"
            sha="$(git rev-parse "pr-${pr}")"
            if git merge-tree --write-tree "origin/${BASE}" "pr-${pr}" >/tmp/merge-tree.out; then
              echo "PR #${pr} merges into ${BASE} (${sha})"
              post_check "${sha}" success "PR #${pr} merges into ${BASE}"
            else
              echo "PR #${pr} does not merge into ${BASE} (${sha})"
              cat /tmp/merge-tree.out || true
              post_check "${sha}" failure "PR #${pr} does not merge into ${BASE}"
            fi
          done
          # Checks land on each PR head. This job must stay green on a
          # push to dev so a stale open PR does not paint the branch red.
          exit 0
