name: Merge check

on:
  # GitHub skips `pull_request` when the PR cannot merge (no merge ref).
  # `pull_request_target` still runs, from the base branch even then.
  # This job must not execute PR code: checkout the base, fetch the PR
  # head as a ref, and detect conflicts with merge-tree.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: ${{ github.event.pull_request.number && format('merge-check-pr-{0}', github.event.pull_request.number) || 'merge-check-dev' }}
  cancel-in-progress: true

jobs:
  mergeable:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Default ref is the PR base (pull_request_target) or the push SHA.
          # Do not set ref to github.event.pull_request.head.sha.

      - name: Check pull requests are mergeable
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          LABEL_OK="MERGE_SUCCESS"
          LABEL_FAIL="MERGE_FAIL"

          find_issue() {
            local pr="$1"
            local label n
            for label in "${LABEL_OK}" "${LABEL_FAIL}"; do
              n="$(gh issue list \
                --label "${label}" \
                --state open \
                --limit 100 \
                --json number,body \
                --jq "[.[] | select(.body | contains(\"megadesk:merge-check:pr-${pr}\") or contains(\"megadesk:merge_success:pr-${pr}\") or contains(\"megadesk:failed-merge:pr-${pr}\")) | .number][0] // empty")"
              if [ -n "${n}" ]; then
                echo "${n}"
                return 0
              fi
            done
          }

          upsert_issue() {
            local pr="$1"
            local base="$2"
            local label="$3"
            local other="$4"
            local title="$5"
            local detail="$6"
            local marker="<!-- megadesk:merge-check:pr-${pr} -->"
            local pr_url body existing
            pr_url="$(gh pr view "${pr}" --json url --jq .url)"
            body="${marker}

          ${pr_url} ${detail} \`${base}\`.

          Workflow run: ${RUN_URL}
          "
            existing="$(find_issue "${pr}")"

            if [ -n "${existing}" ]; then
              gh issue edit "${existing}" \
                --title "${title}" \
                --body "${body}" \
                --add-label "${label}"
              gh issue edit "${existing}" --remove-label "${other}" 2>/dev/null || true
              echo "Issue #${existing} → ${label} for PR #${pr}"
              return 0
            fi

            gh issue create \
              --title "${title}" \
              --label "${label}" \
              --body "${body}"
          }

          if [ "${EVENT}" = "pull_request" ] || [ "${EVENT}" = "pull_request_target" ]; then
            BASE="${BASE_REF}"
            PRS="${PR_NUMBER}"
          else
            BASE="dev"
            PRS="$(gh pr list --base dev --state open --json number --jq '.[].number')"
          fi

          if [ -z "${PRS}" ]; then
            echo "No pull requests to check"
            exit 0
          fi

          git fetch --no-tags origin "${BASE}"

          failed=0
          for pr in ${PRS}; do
            git fetch --no-tags origin "refs/pull/${pr}/head:refs/heads/pr-${pr}"
            if git merge-tree --write-tree "origin/${BASE}" "pr-${pr}" >/tmp/merge-tree.out; then
              echo "PR #${pr} merges into ${BASE}"
              upsert_issue "${pr}" "${BASE}" "${LABEL_OK}" "${LABEL_FAIL}" \
                "MERGE_SUCCESS: PR #${pr} can merge into ${BASE}" \
                "merges into"
            else
              echo "PR #${pr} does not merge into ${BASE}"
              cat /tmp/merge-tree.out || true
              upsert_issue "${pr}" "${BASE}" "${LABEL_FAIL}" "${LABEL_OK}" \
                "MERGE_FAIL: PR #${pr} cannot merge into ${BASE}" \
                "does not merge into"
              failed=1
            fi
          done
          exit "${failed}"
