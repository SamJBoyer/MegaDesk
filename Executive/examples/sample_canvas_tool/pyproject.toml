[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-canvas-tool"
version = "0.1.0"
description = "Example Executive canvas plugin (full BaseNode)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Install Executive into loot first (`pip install -e /path/to/Executive`), then:
#   pip install -e examples/sample_canvas_tool[canvas]
canvas = [
    "dearpygui>=2.0",
]

[project.entry-points."executive.nodes"]
sample_tool = "sample_canvas_tool.node:SampleToolNode"

[tool.setuptools.packages.find]
where = ["src"]
