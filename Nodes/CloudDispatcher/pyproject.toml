[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-dispatcher"
version = "0.1.0"
description = "MegaDesk node: send Cursor cloud agents to open documentation pull requests"
requires-python = ">=3.10"
dependencies = [
    "cursor-sdk>=0.1.0",
    "redis>=5.0.0",
    "megadesk-contracts",
]

[project.optional-dependencies]
# Install megadesk-contracts + dearpygui into the MegaDesk env, then:
#   pip install -e .[canvas]
canvas = [
    "dearpygui>=1.11.1",
]

[project.entry-points."MegaDesk.nodes"]
cloud_dispatcher = "cloud_dispatcher_node:get_exec_spec"

[tool.setuptools]
py-modules = ["cloud_dispatcher_node"]

[tool.setuptools.packages.find]
include = ["CloudDispatcherManager*", "cloud_dispatcher_frontend*"]
