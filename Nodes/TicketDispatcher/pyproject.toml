[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-dispatcher"
version = "0.1.0"
description = "MegaDesk FE node: dispatch agent-ready GitHub issues"
requires-python = ">=3.10"
dependencies = [
    "dearpygui>=1.11.1",
    "redis>=5.0.0",
    "megadesk-contracts",
]

[project.entry-points."MegaDesk.nodes"]
ticket_dispatcher = "ticket_dispatcher_node:get_exec_spec"

[tool.setuptools]
py-modules = ["ticket_dispatcher_app", "ticket_dispatcher_node"]
