[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-manager"
version = "0.1.0"
description = "MegaDesk FE node: show, pull, and open merge_success PRs"
requires-python = ">=3.10"
dependencies = [
    "dearpygui>=1.11.1",
    "megadesk-contracts",
]

[project.entry-points."MegaDesk.nodes"]
pr_manager = "pr_manager_node"

[tool.setuptools]
py-modules = ["pr_manager_app", "pr_manager_node"]
