[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "work-dispatcher"
version = "0.1.0"
description = "MegaDesk human gate: dispatch labeled GitHub issues to a factory"
requires-python = ">=3.10"
dependencies = [
    "dearpygui>=1.11.1",
    "redis>=5.0.0",
    "megadesk-contracts",
]

[project.entry-points."MegaDesk.nodes"]
work_dispatcher = "work_dispatcher_node"

[tool.setuptools]
py-modules = ["work_dispatcher_app", "work_dispatcher_node"]
