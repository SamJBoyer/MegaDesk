[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plant"
version = "0.1.0"
description = "MegaDesk node: PlantManager agent sandbox host (BE) + Floor monitor (FE)"
requires-python = ">=3.10"
dependencies = [
    "cursor-sdk>=0.1.0",
    "redis>=5.0.0",
    "docker>=7.0.0",
    "python-dotenv>=1.0.0",
    "megadesk",
]

[project.optional-dependencies]
# Install megadesk + dearpygui into the MegaDesk env, then:
#   pip install -e .[canvas]
canvas = [
    "dearpygui>=1.11.1",
]

[project.entry-points."MegaDesk.nodes"]
plant = "plant_node:get_exec_spec"

[tool.setuptools]
py-modules = ["plant_node", "redis_packets"]

[tool.setuptools.packages.find]
include = ["PlantManager*", "LiveHarness*", "plant_frontend*"]
