[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mission_control"
version = "0.1.0"
description = "MegaDesk node: MissionControlManager agent sandbox host (BE) + Floor monitor (FE)"
requires-python = ">=3.10"
dependencies = [
    "cursor-sdk>=0.1.0",
    "redis>=5.0.0",
    "docker>=7.0.0",
    "megadesk-contracts",
]

[project.optional-dependencies]
# Install megadesk-contracts + dearpygui into the MegaDesk env, then:
#   pip install -e .[canvas]
canvas = [
    "dearpygui>=1.11.1",
]

[project.entry-points."MegaDesk.nodes"]
mission_control = "mission_control_node:get_exec_spec"

[tool.setuptools]
py-modules = ["mission_control_node", "redis_packets"]

[tool.setuptools.packages.find]
include = ["MissionControlManager*", "AgentHandler*", "mission_control_frontend*"]
