[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code-scope"
version = "0.1.0"
description = "MegaDesk cloud node: ask questions about a cloned repository over HTTP"
requires-python = ">=3.10"
dependencies = [
    "cursor-sdk>=0.1.0",
    "redis>=5.0.0",
    "megadesk-contracts",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
# Install megadesk-contracts + dearpygui into the MegaDesk env, then:
#   pip install -e .[canvas]
canvas = [
    "dearpygui>=1.11.1",
]
service = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.entry-points."MegaDesk.nodes"]
code_scope = "code_scope_node"

[tool.setuptools]
py-modules = ["code_scope_node"]

[tool.setuptools.packages.find]
include = ["CodeScopeManager*", "code_scope_frontend*", "code_scope_tools*"]
