[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "megadesk"
version = "0.1.0"
description = "Shared MegaDesk node exec-spec contract and discovery"
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
