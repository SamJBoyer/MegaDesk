[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "megadesk-contracts"
version = "0.1.0"
description = "MegaDesk shared node contract: FeSpec / BeSpec, discovery, Supervisor client, frame pump"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dearpygui>=2.0",
    "redis>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["megadesk_contracts*"]
